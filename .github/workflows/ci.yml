name: golden-file regression

on:
  push:
  pull_request:

jobs:
  batch-parity:
    name: batch parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install GnuCOBOL
        run: |
          sudo apt-get update
          sudo apt-get install -y gnucobol

      - name: Report toolchain version
        run: cobc --version

      - name: Run golden-file test suite
        run: ./tests/run_golden_tests.sh
